<html lang="en">
<head>

<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Biochemistry Easy with Me</title>
<style>
:root{--navy:#142b4a;--navy2:#203e62;--teal:#18a7a0;--mint:#dff5f1;--ink:#172b43;--muted:#718096;--line:#e5ebf0;--paper:#f5f8fa}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.shell{max-width:980px;margin:auto;min-height:100vh;background:white;box-shadow:0 0 50px #102b4610}.brandbar{height:76px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--navy);letter-spacing:-.4px}.logo{width:40px;height:40px;border-radius:13px;background:var(--navy);color:#6de0d1;display:grid;place-items:center;font-weight:900;font-size:20px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-top:3px}.edition{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}main{padding:26px}.hero{position:relative;overflow:hidden;border-radius:24px;padding:42px;color:white;background:linear-gradient(120deg,#122744,#244b6a 72%,#147f83);min-height:280px}.eyebrow,.section-head small,.exam-banner small,.result>small{font-size:10px;letter-spacing:2px;font-weight:800;color:#8ee5d9}.hero h1{font-size:clamp(34px,6vw,54px);line-height:1.04;letter-spacing:-2px;margin:17px 0 12px;max-width:500px}.hero h1 span{color:#72ded1}.hero p{max-width:440px;color:#d1e0e9;line-height:1.6;font-size:14px}.hero-mark{position:absolute;right:38px;bottom:10px;font-size:130px;font-weight:900;color:#ffffff12;letter-spacing:-15px}.hero-mark span{color:#71ded122}.primary{border:0;border-radius:12px;background:var(--teal);color:white;padding:13px 18px;font-weight:800;box-shadow:0 7px 18px #0c8e8730}.primary b{margin-left:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 34px}.stats div,.result-stats div{padding:17px;border:1px solid var(--line);border-radius:15px}.stats b,.result-stats b{display:block;color:var(--navy);font-size:24px}.stats small,.result-stats small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.section-head small{color:var(--teal)}h2{margin:5px 0 0;color:var(--navy)}.count{font-size:11px;color:var(--muted)}.chapter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.chapter-card{position:relative;text-align:left;padding:17px;border:1px solid var(--line);border-radius:16px;background:white;min-height:112px;color:var(--ink);transition:.2s}.chapter-card:hover{border-color:#83d4cb;transform:translateY(-2px)}.chapter-no{display:block;color:var(--teal);font-size:10px;font-weight:900;letter-spacing:1px;margin-bottom:14px}.chapter-card strong{display:block;font-size:14px;color:var(--navy)}.chapter-card small{display:block;color:var(--muted);font-size:10px;margin-top:6px}.arrow{position:absolute;right:15px;top:13px;color:#91a3b5}.exam-banner{margin-top:24px;padding:25px;border-radius:18px;background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center;gap:20px}.exam-banner h2{color:white;margin:8px 0}.exam-banner p{color:#c2d0dc;font-size:12px;margin:0}.light-btn{background:white;color:var(--navy);border:0;border-radius:11px;padding:13px 16px;font-weight:800;white-space:nowrap}.quiz-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:1px}.back,.text-btn{border:0;background:transparent;color:var(--teal);font-weight:800;padding:10px 0}.progress{height:6px;background:#edf2f5;border-radius:9px;margin:20px 0 34px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--teal);transition:.2s}.q-meta{display:flex;justify-content:space-between;color:var(--teal);font-size:10px;font-weight:900;letter-spacing:1px}.question{font-size:clamp(22px,4vw,30px);line-height:1.3;margin:22px 0 25px}.options{display:grid;gap:11px}.option{display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);font-weight:600}.option span{width:29px;height:29px;display:grid;place-items:center;background:#eff5f7;color:var(--navy);border-radius:9px;font-size:12px}.option.selected{border:2px solid var(--teal);background:#f1fbf9}.option.selected span{background:var(--teal);color:white}.quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:25px}.quiz-actions .primary{min-width:150px}.explanation{margin-top:20px;background:#eef9f6;border-left:4px solid var(--teal);padding:15px;border-radius:9px;font-size:13px}.explanation p{margin-bottom:0;line-height:1.55;color:#506477}.result{text-align:center;max-width:680px;margin:auto}.result-icon{font-size:48px;margin:10px}.result h1{font-size:65px;color:var(--teal);margin:10px}.result>p{color:var(--muted)}.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0 35px;text-align:center}.result h2{text-align:left;margin-bottom:14px}.review{text-align:left;display:grid;gap:10px;margin-bottom:20px}.review article{padding:15px;border:1px solid var(--line);border-radius:12px}.review article b{font-size:13px}.review p{font-size:12px;margin:9px 0 4px}.review small{font-size:11px;color:var(--muted);line-height:1.5}.good{color:#16866e}.bad{color:#c65353}.correct-answer{color:#16866e}.wide{width:100%;margin:6px 0}.footer{text-align:center;padding:20px;color:#9aa8b6;font-size:10px;letter-spacing:.5px;border-top:1px solid var(--line);margin-top:25px}
@media(max-width:650px){.brandbar{padding:0 17px;height:66px}.edition{font-size:9px}main{padding:17px}.hero{padding:28px 23px;min-height:265px}.hero-mark{right:16px;font-size:90px}.stats{gap:7px}.stats div{padding:12px}.stats b{font-size:20px}.stats small{font-size:9px}.chapter-grid{grid-template-columns:repeat(2,1fr)}.chapter-card{min-height:105px;padding:14px}.exam-banner{align-items:flex-start;flex-direction:column}.exam-banner .light-btn{width:100%}}
</style>
</head>
<body><div class="shell"><header class="brandbar"><div class="brand"><div class="logo">B</div><div>Biochemistry Easy with Me<small>BY DR. AHMED AL-KISHER</small></div></div><div class="edition">2027 EDITION</div></header><main id="app"></main><footer class="footer">BIOCHEMISTRY EASY WITH ME · LEARN WITH CONFIDENCE</footer></div>
<script>

const QUESTIONS = [{"chapter": "Biochemistry Basics", "q": "Which of the following is the main solvent in living organisms?", "options": ["Ethanol", "Water", "Acetone", "Chloroform"], "a": 1, "ex": "Water is the major solvent in cells and supports biochemical reactions."}, {"chapter": "Water & pH", "q": "At 25°C, a neutral aqueous solution has a pH of:", "options": ["0", "5", "7", "14"], "a": 2, "ex": "At 25°C, neutrality corresponds to [H⁺] = [OH⁻] and pH 7."}, {"chapter": "Water & pH", "q": "The pH of a solution is defined as:", "options": ["−log[H⁺]", "log[OH⁻]", "[H⁺] × [OH⁻]", "−log[Na⁺]"], "a": 0, "ex": "pH = −log₁₀ of hydrogen ion activity; in dilute solutions it is approximated using [H⁺]."}, {"chapter": "Water & pH", "q": "Which buffer system is especially important in blood?", "options": ["Acetate only", "Bicarbonate buffer", "Starch buffer", "Urea buffer"], "a": 1, "ex": "The carbonic acid–bicarbonate system is a major extracellular blood buffer."}, {"chapter": "Amino Acids", "q": "Which part of an amino acid differs among the standard amino acids?", "options": ["Amino group", "Carboxyl group", "Hydrogen atom", "R group (side chain)"], "a": 3, "ex": "The R group determines each amino acid's identity and chemical properties."}, {"chapter": "Amino Acids", "q": "A peptide bond forms between the:", "options": ["Two side chains", "Carboxyl group of one amino acid and amino group of another", "Two amino groups", "Two carboxyl groups"], "a": 1, "ex": "A peptide bond is formed by condensation between a carboxyl group and an amino group."}, {"chapter": "Amino Acids", "q": "Which amino acid contains sulfur?", "options": ["Glycine", "Alanine", "Methionine", "Serine"], "a": 2, "ex": "Methionine and cysteine are the two sulfur-containing standard amino acids."}, {"chapter": "Proteins", "q": "The primary structure of a protein refers to its:", "options": ["Amino acid sequence", "Alpha helices only", "Three-dimensional folding", "Association of subunits"], "a": 0, "ex": "Primary structure is the linear sequence of amino acids joined by peptide bonds."}, {"chapter": "Proteins", "q": "Which interaction stabilizes an alpha helix?", "options": ["Peptide bond hydrolysis", "Hydrogen bonds", "Disulfide bonds only", "Ionic bonds between all R groups"], "a": 1, "ex": "Hydrogen bonds between backbone C=O and N–H groups stabilize alpha helices."}, {"chapter": "Proteins", "q": "Denaturation usually disrupts which levels of protein structure?", "options": ["Primary only", "Secondary, tertiary and/or quaternary", "Peptide sequence always", "Amino acid composition"], "a": 1, "ex": "Denaturation commonly disrupts higher-order structure while leaving the primary sequence intact."}, {"chapter": "Enzymes", "q": "Most enzymes are biologically classified as:", "options": ["Carbohydrates", "Lipids", "Proteins", "Nucleic acids"], "a": 2, "ex": "Most enzymes are proteins, although some RNA molecules also have catalytic activity."}, {"chapter": "Enzymes", "q": "An enzyme increases reaction rate mainly by:", "options": ["Increasing ΔG", "Raising activation energy", "Lowering activation energy", "Changing the reaction equilibrium"], "a": 2, "ex": "Enzymes lower activation energy without changing the overall ΔG or equilibrium position."}, {"chapter": "Enzymes", "q": "The active site is the region where the enzyme:", "options": ["Stores ATP", "Binds substrate and catalyzes the reaction", "Is degraded", "Binds DNA exclusively"], "a": 1, "ex": "The active site recognizes substrate and provides the catalytic environment."}, {"chapter": "Enzymes", "q": "A competitive inhibitor typically:", "options": ["Binds the active site", "Destroys the enzyme", "Always decreases Km", "Binds only to the enzyme–substrate complex"], "a": 0, "ex": "A competitive inhibitor competes with substrate for the active site; apparent Km increases while Vmax is unchanged."}, {"chapter": "Enzymes", "q": "The Michaelis constant (Km) is the substrate concentration at which:", "options": ["Velocity is zero", "Velocity is half Vmax", "Velocity is Vmax", "All enzyme is denatured"], "a": 1, "ex": "For simple Michaelis–Menten kinetics, Km is the substrate concentration at ½ Vmax."}, {"chapter": "Carbohydrates", "q": "Glucose is classified as a:", "options": ["Disaccharide", "Polysaccharide", "Monosaccharide", "Sugar alcohol"], "a": 2, "ex": "Glucose is a six-carbon monosaccharide and an important cellular fuel."}, {"chapter": "Carbohydrates", "q": "The storage form of glucose in humans is:", "options": ["Cellulose", "Glycogen", "Starch", "Lactose"], "a": 1, "ex": "Humans store glucose as glycogen, mainly in liver and skeletal muscle."}, {"chapter": "Carbohydrates", "q": "Lactose is composed of:", "options": ["Glucose + fructose", "Glucose + galactose", "Glucose + glucose", "Fructose + galactose"], "a": 1, "ex": "Lactose is the milk sugar, made of glucose and galactose."}, {"chapter": "Lipids", "q": "A triacylglycerol consists of:", "options": ["Glycerol + three fatty acids", "Three glycerols + one fatty acid", "Cholesterol + phosphate", "Glycerol + three amino acids"], "a": 0, "ex": "Triacylglycerols contain a glycerol backbone esterified to three fatty acids."}, {"chapter": "Lipids", "q": "Which lipid is a major component of cell membranes?", "options": ["Triacylglycerol", "Phospholipid", "Cholesteryl ester only", "Wax"], "a": 1, "ex": "Phospholipids are major membrane components because they are amphipathic."}, {"chapter": "Lipids", "q": "Beta-oxidation of fatty acids mainly occurs in the:", "options": ["Nucleus", "Mitochondrial matrix", "Ribosome", "Golgi apparatus"], "a": 1, "ex": "Most fatty acid beta-oxidation occurs in the mitochondrial matrix; very-long-chain fatty acids begin in peroxisomes."}, {"chapter": "Metabolism", "q": "The main purpose of glycolysis is to convert glucose into:", "options": ["Acetyl-CoA directly", "Pyruvate", "Urea", "Glycogen"], "a": 1, "ex": "Glycolysis converts glucose to pyruvate, generating ATP and NADH."}, {"chapter": "Metabolism", "q": "Where does the citric acid cycle occur in eukaryotic cells?", "options": ["Cytosol", "Mitochondrial matrix", "Lysosome", "Nucleus"], "a": 1, "ex": "The citric acid cycle enzymes are located mainly in the mitochondrial matrix."}, {"chapter": "Metabolism", "q": "Which molecule is the major energy currency of the cell?", "options": ["DNA", "ATP", "Urea", "Cholesterol"], "a": 1, "ex": "ATP transfers usable chemical energy to many cellular processes."}, {"chapter": "Vitamins", "q": "Which vitamin is required for normal collagen hydroxylation?", "options": ["Vitamin A", "Vitamin C", "Vitamin D", "Vitamin K"], "a": 1, "ex": "Vitamin C is a cofactor for prolyl and lysyl hydroxylases in collagen synthesis."}, {"chapter": "Vitamins", "q": "Which vitamin is essential for blood clotting factor activation?", "options": ["Vitamin K", "Vitamin C", "Vitamin B1", "Vitamin E"], "a": 0, "ex": "Vitamin K is needed for gamma-carboxylation of several clotting factors."}, {"chapter": "Vitamins", "q": "A deficiency of vitamin B1 (thiamine) can cause:", "options": ["Scurvy", "Beriberi", "Rickets", "Night blindness"], "a": 1, "ex": "Thiamine deficiency can cause beriberi and Wernicke–Korsakoff syndrome."}, {"chapter": "Molecular Biology", "q": "DNA contains which sugar?", "options": ["Ribose", "Deoxyribose", "Glucose", "Fructose"], "a": 1, "ex": "DNA contains 2-deoxyribose, whereas RNA contains ribose."}, {"chapter": "Molecular Biology", "q": "Which base is found in RNA instead of thymine?", "options": ["Cytosine", "Adenine", "Uracil", "Guanine"], "a": 2, "ex": "RNA uses uracil in place of thymine."}, {"chapter": "Molecular Biology", "q": "Translation is the process of:", "options": ["DNA replication", "RNA synthesis from DNA", "Protein synthesis from mRNA", "DNA repair"], "a": 2, "ex": "Ribosomes translate the codon sequence of mRNA into a polypeptide."}];
const $ = s => document.querySelector(s);
const state = {chapter:"All Chapters",mode:"practice",items:[],index:0,answers:[],started:0,timer:null,seconds:0};
const chapters = ["All Chapters",...new Set(QUESTIONS.map(q=>q.chapter))];
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function saved(){try{return JSON.parse(localStorage.getItem("bem-progress")||'{"done":0,"correct":0,"best":0}')}catch{return {done:0,correct:0,best:0}}}
function save(p){localStorage.setItem("bem-progress",JSON.stringify(p))}
function renderHome(){
 const p=saved();
 $("#app").innerHTML=`
 <section class="hero"><div class="eyebrow">YOUR BIOCHEMISTRY LEARNING HUB</div><h1>Understand.<br><span>Practice.</span> Excel.</h1><p>Build strong foundations in Biochemistry with focused lessons and interactive MCQ exams.</p><button class="primary" id="startAll">Start learning <b>→</b></button><div class="hero-mark">B<span>•</span>M</div></section>
 <section class="stats"><div><b>${p.done}</b><small>Questions answered</small></div><div><b>${p.correct}</b><small>Correct answers</small></div><div><b>${p.best}%</b><small>Best score</small></div></section>
 <div class="section-head"><div><small>LEARNING LIBRARY</small><h2>Explore chapters</h2></div><span class="count">${chapters.length-1} chapters</span></div>
 <div class="chapter-grid">${chapters.slice(1).map((c,i)=>`<button class="chapter-card" data-chapter="${esc(c)}"><span class="chapter-no">${String(i+1).padStart(2,"0")}</span><strong>${esc(c)}</strong><small>${QUESTIONS.filter(q=>q.chapter===c).length} practice questions</small><span class="arrow">↗</span></button>`).join("")}</div>
 <section class="exam-banner"><div><small>TEST YOUR KNOWLEDGE</small><h2>Ready for a challenge?</h2><p>Take a timed mixed quiz and review your performance.</p></div><button class="light-btn" id="startExam">Start exam →</button></section>`;
 $("#startAll").onclick=()=>startQuiz("All Chapters","practice");
 $("#startExam").onclick=()=>startQuiz("All Chapters","exam");
 document.querySelectorAll("[data-chapter]").forEach(b=>b.onclick=()=>startQuiz(b.dataset.chapter,"practice"));
}
function startQuiz(chapter,mode){
 clearInterval(state.timer);
 state.chapter=chapter;state.mode=mode;
 let pool=QUESTIONS.filter(q=>chapter==="All Chapters"||q.chapter===chapter);
 state.items=[...pool].sort(()=>Math.random()-.5).slice(0,mode==="exam"?20:pool.length);
 state.index=0;state.answers=Array(state.items.length).fill(null);state.seconds=mode==="exam"?state.items.length*45:0;
 $("#app").innerHTML=`<div class="quiz-top"><button class="back" id="quit">← Home</button><span>${mode==="exam"?"TIMED EXAM":"PRACTICE MODE"}</span><span id="timer">${mode==="exam"?"00:00":""}</span></div><div class="progress"><i id="progressBar"></i></div><div id="questionArea"></div>`;
 $("#quit").onclick=()=>{clearInterval(state.timer);renderHome()};
 if(mode==="exam"){tick();state.timer=setInterval(tick,1000)}
 renderQuestion();
}
function tick(){
 let m=Math.floor(state.seconds/60),s=state.seconds%60;
 $("#timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
 if(state.seconds<=0){clearInterval(state.timer);finishQuiz()} else state.seconds--;
}
function renderQuestion(){
 const q=state.items[state.index],n=state.index+1;
 $("#progressBar").style.width=`${n/state.items.length*100}%`;
 $("#questionArea").innerHTML=`<div class="q-meta"><span>${esc(q.chapter)}</span><span>QUESTION ${n} / ${state.items.length}</span></div><h2 class="question">${esc(q.q)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${state.answers[state.index]===i?"selected":""}" data-option="${i}"><span>${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join("")}</div><div class="quiz-actions"><button class="text-btn" id="prev" ${state.index===0?"disabled":""}>← Previous</button><button class="primary" id="next">${state.index===state.items.length-1?"Finish quiz":"Next question →"}</button></div><div class="explanation" id="explanation" hidden></div>`;
 document.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>{
   state.answers[state.index]=Number(b.dataset.option);renderQuestion();
   if(state.mode==="practice"){const ex=$("#explanation");ex.hidden=false;ex.innerHTML=`<strong>${state.answers[state.index]===q.a?"Correct! ✓":"Not quite — correct answer: "+q.options[q.a]}</strong><p>${esc(q.ex)}</p>`}
 });
 $("#prev").onclick=()=>{if(state.index>0){state.index--;renderQuestion()}};
 $("#next").onclick=()=>{if(state.index===state.items.length-1)finishQuiz();else{state.index++;renderQuestion()}};
 if(state.mode==="practice"&&state.answers[state.index]!==null){const ex=$("#explanation");ex.hidden=false;ex.innerHTML=`<strong>${state.answers[state.index]===q.a?"Correct! ✓":"Correct answer: "+q.options[q.a]}</strong><p>${esc(q.ex)}</p>`}
}
function finishQuiz(){
 clearInterval(state.timer);
 const correct=state.items.reduce((n,q,i)=>n+(state.answers[i]===q.a?1:0),0);
 const pct=Math.round(correct/state.items.length*100);
 const p=saved();p.done+=state.items.length;p.correct+=correct;p.best=Math.max(p.best,pct);save(p);
 $("#app").innerHTML=`<div class="result"><div class="result-icon">${pct>=70?"🏆":"📘"}</div><small>QUIZ COMPLETED</small><h1>${pct}%</h1><p>You answered <b>${correct}</b> out of <b>${state.items.length}</b> questions correctly.</p><div class="result-stats"><div><b>${correct}</b><small>Correct</small></div><div><b>${state.items.length-correct}</b><small>Incorrect</small></div><div><b>${state.items.length}</b><small>Total</small></div></div><h2>Review your answers</h2><div class="review">${state.items.map((q,i)=>`<article><b>${i+1}. ${esc(q.q)}</b><p class="${state.answers[i]===q.a?"good":"bad"}">${state.answers[i]===null?"Not answered":state.answers[i]===q.a?"✓ "+esc(q.options[q.a]):"✕ Your answer: "+esc(q.options[state.answers[i]])}</p>${state.answers[i]===q.a?"":`<p class="correct-answer">Correct: ${esc(q.options[q.a])}</p>`}<small>${esc(q.ex)}</small></article>`).join("")}</div><button class="primary wide" id="again">Try again</button><button class="text-btn wide" id="home">Back to home</button></div>`;
 $("#again").onclick=()=>startQuiz(state.chapter,state.mode);$("#home").onclick=renderHome;
}
renderHome();

</script></body></html>
