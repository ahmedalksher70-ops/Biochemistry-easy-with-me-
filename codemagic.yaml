
workflows:
  android-debug:
    name: Biochemistry Easy with Me APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Prepare Android project
        script: |
          set -e
          mkdir -p build_src
          unzip -oq Biochemistry_Easy_with_Me_Firebase_Connected.zip -d build_src
          PROJECT_DIR=$(find build_src -name settings.gradle.kts -print -quit | sed 's|/settings.gradle.kts$||')
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
